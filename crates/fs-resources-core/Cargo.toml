[package]
name = "fs-resources-core"
description = "Program core of FreeSynergy resources: what we have, who has time, what we need and who offers it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.3.0" }
# The contract and the provider rule (ADR 0045).
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.25.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
