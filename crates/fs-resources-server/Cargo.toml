[package]
name = "fs-resources-server"
description = "Cap'n Proto server of FreeSynergy resources: the root of resources.capnp over a Unix socket. Serves the support report, the capability list and the type catalog; the rest of the contract is Unsupported (DESIGN.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fs_resources_server"

[dependencies]
fs-resources-core = { path = "../fs-resources-core" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11", features = ["rpc"] }
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
capnp = "0.27"
capnp-rpc = "0.27"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
